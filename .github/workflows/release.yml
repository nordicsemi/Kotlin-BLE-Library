name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 2.0.0-beta08'
        required: true
        type: string
# Only one release at a time.
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
env:
  # The version used by the Nordic Gradle plugins for the documentation, and the libraries.
  RELEASE_VERSION: ${{ inputs.version }}
  # The branch to release.
  BRANCH: ${{ github.ref_name }}
# The release is made in stages. Each one depends on the previous one, so the graph shows where
# it failed. After fixing the problem, use "Re-run failed jobs" to continue from that stage.
jobs:
  check:
    name: 1. Check the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - shell: bash
        run: |
          if [[ "${{ github.ref_type }}" != "branch" ]]; then
            echo "::error::Run this workflow on a branch: choose the branch in \"Use workflow from\"."
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$RELEASE_VERSION' is not a valid version, e.g. 2.0.0 or 2.0.0-beta08."
            exit 1
          fi
          if gh api "repos/${{ github.repository }}/git/ref/tags/$RELEASE_VERSION" > /dev/null 2>&1; then
            echo "::error::The tag $RELEASE_VERSION already exists."
            exit 1
          fi

  test:
    name: 2. Test
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'jetbrains'
          java-version: '21'
          cache: 'gradle'
      # The merge commit of a pull request was not tested by the "Unit tests" workflow, so test it.
      - name: Run unit tests
        shell: bash
        run: ./gradlew test jvmTest --continue --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  documentation:
    name: 3. Generate documentation
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Push the documentation.
    outputs:
      # The commit with the documentation, which will be tagged.
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'jetbrains'
          java-version: '21'
          cache: 'gradle'
      # The version is taken from RELEASE_VERSION, there is no need to create a tag first.
      - name: Generate documentation
        shell: bash
        run: ./gradlew dokkaGenerate --stacktrace
      - name: Commit the documentation
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Docs for $RELEASE_VERSION"
          git push origin "HEAD:$BRANCH"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  tag:
    name: 4. Tag
    needs: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Push the tag.
    steps:
      # The tag points at the commit with the documentation.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.documentation.outputs.commit }}
      - shell: bash
        run: |
          git tag "$RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_VERSION"

  publish:
    name: 5. Publish to Maven Central
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.version }}
      - uses: actions/setup-java@v6
        with:
          distribution: 'jetbrains'
          java-version: '21'
      - shell: bash
        env:
          # The following env variables are used by gradle/publish-module.gradle
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          # The following env variables are used by gradle/publish-root.gradle.kts
          OSSR_USERNAME: ${{ secrets.OSSR_USERNAME }}
          OSSR_PASSWORD: ${{ secrets.OSSR_PASSWORD }}
          SONATYPE_STAGING_PROFILE_ID: ${{ secrets.SONATYPE_STAGING_PROFILE_ID }}
        # The script generates sec.gpg file that is required by gradle/publish-module.gradle
        # and runs the Gradle tasks.
        run: |
          java --version
          echo "${{ secrets.GPG_FILE }}" > sec.gpg.asc
          gpg -d --passphrase "${{ secrets.GPG_FILE_PSWD }}" --batch sec.gpg.asc > sec.gpg
          ./gradlew publish
          ./gradlew releaseStagingRepositories
