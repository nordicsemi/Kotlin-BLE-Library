name: Deploy to Nexus
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
jobs:
  deployToNexus:
    runs-on: ubuntu-latest
    steps:
      # The version is the name of the tag, so a branch can't be published by mistake.
      - name: Check the ref
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          echo "::error::Run this workflow on a tag: choose the tag in \"Use workflow from\"."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'jetbrains'
          java-version: '21'
      - shell: bash
        env:
          # The version of the release, used by the Nordic Gradle plugins.
          RELEASE_VERSION: ${{ github.ref_name }}
          # The following env variables are used by gradle/publish-module.gradle
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          # The following env variables are used by gradle/publish-root.gradle.kts
          OSSR_USERNAME: ${{ secrets.OSSR_USERNAME }}
          OSSR_PASSWORD: ${{ secrets.OSSR_PASSWORD }}
          SONATYPE_STAGING_PROFILE_ID: ${{ secrets.SONATYPE_STAGING_PROFILE_ID }}
        # The script generates sec.gpg file that is required by gradle/publish-module.gradle
        # and runs the Gradle tasks.
        run: |
          java --version
          echo "${{ secrets.GPG_FILE }}" > sec.gpg.asc
          gpg -d --passphrase "${{ secrets.GPG_FILE_PSWD }}" --batch sec.gpg.asc > sec.gpg
          ./gradlew publish
          ./gradlew releaseStagingRepositories
